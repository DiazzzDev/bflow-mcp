<!doctype html>
<html lang="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{color-scheme:light dark;--bg:#fff;--fg:#172033;--muted:#65748a;--card:#f7f9fc;--line:#dce3ed;--accent:#167b62;--soft:#e7f5ef;--warn:#a96513;--danger:#bd3c46;--shadow:0 8px 24px #1522380b}
    @media(prefers-color-scheme:dark){:root{--bg:#101722;--fg:#edf2fa;--muted:#aab7c8;--card:#192433;--line:#354457;--accent:#68c7a4;--soft:#18372d;--warn:#f2bd6a;--danger:#ff8d94;--shadow:0 8px 24px #0003}}
    :root[data-theme="light"]{color-scheme:light;--bg:#fff;--fg:#172033;--muted:#65748a;--card:#f7f9fc;--line:#dce3ed;--accent:#167b62;--soft:#e7f5ef;--warn:#a96513;--danger:#bd3c46;--shadow:0 8px 24px #1522380b}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#101722;--fg:#edf2fa;--muted:#aab7c8;--card:#192433;--line:#354457;--accent:#68c7a4;--soft:#18372d;--warn:#f2bd6a;--danger:#ff8d94;--shadow:0 8px 24px #0003}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}main{padding:clamp(14px,3vw,24px);display:grid;gap:18px;max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:1.35rem;margin:0}.count{color:var(--muted);font-size:.9rem}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.search{flex:1 1 220px}input,select,button{font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 13px}button{cursor:pointer}button:hover{border-color:var(--accent);background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0}.card-head>div{min-width:0}.name{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:.88rem;margin-top:3px;overflow-wrap:anywhere}.badge{flex:0 0 auto;white-space:nowrap;border-radius:99px;padding:4px 9px;background:var(--soft);color:var(--accent);font-size:.78rem;font-weight:650}.badge.warning{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.badge.critical{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}.progress-wrap{display:grid;gap:7px}.progress-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.86rem}.track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:inherit;transition:width .35s ease}.fill.warning{background:var(--warn)}.fill.critical{background:var(--danger)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);border-radius:11px;padding:9px;min-width:0}.metric span{display:block;color:var(--muted);font-size:.78rem}.metric strong{display:block;margin-top:3px;font-size:clamp(.72rem,2.6vw,.94rem);white-space:nowrap;font-variant-numeric:tabular-nums}.unavailable{margin:0;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9rem}.empty,.error{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.error{color:var(--danger)}@media(max-width:390px){.metrics{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between;gap:8px}.metric strong{margin:0}}
  </style>
</head>
<body><main aria-live="polite" aria-busy="true"><header class="top"><div><h1 id="title"></h1><div id="count" class="count"></div></div><button id="refresh" type="button" aria-label="Refresh">↻</button></header><section class="toolbar"><input class="search" id="search" type="search" aria-label="Search budgets"><select id="period" aria-label="Filter by period"></select></section><section id="content" class="list"></section></main>
<script>
(() => {
  const root=document.documentElement,main=document.querySelector('main'),title=document.querySelector('#title'),count=document.querySelector('#count'),content=document.querySelector('#content'),search=document.querySelector('#search'),period=document.querySelector('#period');
  let labels={},locale='es',budgets=[],sequence=0,initializeId=null,initialized=false;
  const emit=(method,params)=>{const request=method==='ui/initialize'||method==='tools/call';const msg={jsonrpc:'2.0',method,params};if(request)msg.id=++sequence;parent.postMessage(msg,'*');return request?msg.id:null};
  const reportSize=()=>{if(initialized)emit('ui/notifications/size-changed',{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight})};new ResizeObserver(reportSize).observe(document.body);
  const setTheme=context=>{if(['light','dark'].includes(context?.theme))root.dataset.theme=context.theme};
  const records=value=>{if(Array.isArray(value))return value;if(value?.budgets)return records(value.budgets);if(value?.data)return records(value.data);if(value?.content)return records(value.content);return []};
  const periodLabel=period=>{const key=`period${String(period||'').toLowerCase().replace(/(^|_)([a-z])/g,(_,separator,letter)=>letter.toUpperCase())}`;return labels[key]||labels[String(period||'').toLowerCase()]||labels.periodUnknown||period||''};
  const money=(n,c)=>n==null?'—':new Intl.NumberFormat(locale,c?{style:'currency',currency:c,currencyDisplay:'narrowSymbol'}:{maximumFractionDigits:2}).format(Number(n));
  const text=(parent,value)=>parent.append(document.createTextNode(value==null?'':String(value)));
  const showEmpty=message=>{content.replaceChildren();const el=document.createElement('div');el.className='empty';text(el,message);content.append(el)};
  const showError=result=>{content.replaceChildren();const box=document.createElement('div');box.className='error';const first=result.content?.find?.(item=>item.type==='text')?.text||result.message||labels.progressUnavailable||'';text(box,first);const retry=document.createElement('button');retry.type='button';retry.textContent=labels.retry||'Retry';retry.addEventListener('click',()=>{main.setAttribute('aria-busy','true');emit('tools/call',{name:'listBudgets',arguments:{}})});box.append(document.createElement('br'),retry);content.append(box);main.setAttribute('aria-busy','false')};
  const renderCard=budget=>{
    const card=document.createElement('article');card.className='card';
    const head=document.createElement('div');head.className='card-head';const heading=document.createElement('div');const name=document.createElement('div');name.className='name';text(name,budget.name||budget.categoryName||budget.walletName||labels.nameFallback||'');heading.append(name);
    const sub=document.createElement('div');sub.className='sub';const owner=budget.categoryName?`${labels.category||''}${budget.walletName?` · ${budget.walletName}`:''}`:`${labels.wallet||''}${budget.walletName?` · ${budget.walletName}`:''}`;text(sub,`${periodLabel(budget.period)}${owner?' · '+owner:''}`);heading.append(sub);
    const status=document.createElement('span');const pct=Number(budget.percentage||0);const hasProgress=budget.progressAvailable&&budget.percentage!=null;const state=hasProgress?(budget.status==='CRITICAL'||pct>=90?'critical':budget.status==='WARNING'||pct>=60?'warning':''):'';status.className='badge '+state;text(status,hasProgress?(state?labels[state]:(labels.healthy||'')):(labels.statusUnavailable||labels.progressUnavailable||''));head.append(heading,status);card.append(head);
    if(budget.progressAvailable&&budget.percentage!=null){const wrap=document.createElement('div');wrap.className='progress-wrap';const meta=document.createElement('div');meta.className='progress-meta';text(meta,`${Math.round(pct)}%`);if(budget.daysLeft!=null){const days=document.createElement('span');text(days,`${budget.daysLeft} ${labels.daysLeft||''}`);meta.append(days)}wrap.append(meta);const track=document.createElement('div');track.className='track';track.setAttribute('role','progressbar');track.setAttribute('aria-valuenow',String(Math.max(0,Math.min(100,pct))));track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');const fill=document.createElement('div');fill.className='fill '+state;fill.style.width=`${Math.max(0,Math.min(100,pct))}%`;track.append(fill);wrap.append(track);card.append(wrap)}else{const note=document.createElement('p');note.className='unavailable';text(note,budget.progressUnavailableLabel||labels.progressUnavailable||'');card.append(note)}
    const metrics=document.createElement('div');metrics.className='metrics';[[labels.spent,budget.spent],[labels.remaining,budget.remaining],[labels.limit,budget.budgetLimit]].forEach(([label,value])=>{const m=document.createElement('div');m.className='metric';const l=document.createElement('span');text(l,label);const v=document.createElement('strong');text(v,money(value,budget.currency));m.append(l,v);metrics.append(m)});card.append(metrics);return card;
  };
  const render=()=>{const q=search.value.trim().toLocaleLowerCase(locale),p=period.value;const filtered=budgets.filter(b=>(p==='all'||String(b.period).toLowerCase()===p)&&`${b.walletName||''} ${b.categoryName||''} ${b.name||''}`.toLocaleLowerCase(locale).includes(q));const displayedCount=filtered.length===budgets.length?budgets.length:filtered.length;const countLabel=displayedCount===1?labels.budgetCountOne:labels.budgetCountMany;count.textContent=filtered.length===budgets.length?`${budgets.length} ${countLabel||''}`.trim():`${filtered.length} / ${budgets.length} ${countLabel||''}`.trim();content.replaceChildren();if(!filtered.length){showEmpty(labels.empty||'');return}filtered.forEach(b=>content.append(renderCard(b)));main.setAttribute('aria-busy','false')};
  const setPayload=payload=>{labels=payload.labels||labels;locale=payload.locale||locale;root.lang=locale;title.textContent=labels.title||'';search.placeholder=labels.search||'';search.setAttribute('aria-label',labels.search||'');document.querySelector('#refresh').setAttribute('aria-label',labels.refresh||'Refresh');period.replaceChildren();[['all','all'],['daily','daily'],['weekly','weekly'],['monthly','monthly'],['yearly','yearly']].forEach(([value,key])=>{const option=document.createElement('option');option.value=value;option.textContent=labels[key]||labels['period'+key[0].toUpperCase()+key.slice(1)]||key;period.append(option)});if(payload.status==='LOADING'){showEmpty(labels.loading||'');main.setAttribute('aria-busy','true');return}budgets=records(payload.data);render()};
  search.addEventListener('input',render);period.addEventListener('change',render);document.querySelector('#refresh').addEventListener('click',()=>{main.setAttribute('aria-busy','true');emit('tools/call',{name:'listBudgets',arguments:{}})});
  window.addEventListener('message',({data})=>{if(!data)return;if(data.id===initializeId&&data.result){setTheme(data.result.hostContext);initialized=true;emit('ui/notifications/initialized',{});reportSize();return}if(data.method==='ui/notifications/host-context-changed')setTheme(data.params);if(!initialized||data.method!=='ui/notifications/tool-result')return;const result=data.params?.result||data.params||{};const payload=result._meta?.['io.bflow/budgets']||result.meta?.['io.bflow/budgets']||(result.labels?result:null);if(result.isError||result.code){showError(result);return}if(payload){setPayload(payload);return}if(result.content?.[0]?.text){setPayload({labels,data:{budgets:[]},fallbackText:result.content[0].text});showError(result)}});
  initializeId=emit('ui/initialize',{appInfo:{name:'BFlow budgets',version:'1.1.0'},protocolVersion:'2026-01-26',appCapabilities:{}});
})();
</script></main></body></html>

<!doctype html>
<html lang=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
  :root { color-scheme: light dark; --bg:#fff;--fg:#172033;--card:#f5f7fb;--line:#c8d0dc;--accent:#075fc4;--muted:#526176; } @media(prefers-color-scheme:dark){:root{--bg:#101722;--fg:#edf2fa;--card:#1c2736;--line:#3a4a5d;--accent:#8dc2ff;--muted:#aab7c8}} :root[data-theme="dark"]{color-scheme:dark;--bg:#101722;--fg:#edf2fa;--card:#1c2736;--line:#3a4a5d;--accent:#8dc2ff;--muted:#aab7c8} :root[data-theme="light"]{color-scheme:light}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}main{padding:1rem;display:grid;gap:1rem}.card{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:1rem}.item{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.key{color:var(--muted)}.actions{display:flex;gap:.75rem;flex-wrap:wrap}button{padding:.5rem .75rem;border-radius:.35rem;border:1px solid var(--accent);background:var(--accent);color:Canvas}button.secondary{background:transparent;color:var(--fg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style></head><body><main aria-live="polite" aria-busy="true"><h1 id="title"></h1><p id="message"></p><section id="preview" class="card"></section><div class="actions"><button id="confirm" type="button"></button><button id="cancel" class="secondary" type="button"></button></div></main><script>
(() => { const root=document.documentElement, main=document.querySelector('main'), title=document.querySelector('#title'), message=document.querySelector('#message'), preview=document.querySelector('#preview'), confirm=document.querySelector('#confirm'), cancel=document.querySelector('#cancel'); let labels={}, input={}, toolName='', sequence=0; const emit=(method,params)=>parent.postMessage({jsonrpc:'2.0',id:++sequence,method,params},'*'); const setTheme=context=>{if(context&&(context.theme==='dark'||context.theme==='light'))root.dataset.theme=context.theme}; const show=payload=>{labels=payload.labels||{}; root.lang=payload.locale||''; toolName=payload.toolName||toolName; title.textContent=labels.title||''; message.textContent=payload.message||''; preview.replaceChildren(); Object.entries(payload.preview||{}).forEach(([key,value])=>{const row=document.createElement('div');row.className='item';const name=document.createElement('span');name.className='key';name.textContent=key;const data=document.createElement('span');data.textContent=value==null?'':String(value);row.append(name,data);preview.append(row)});confirm.textContent=labels.confirm||'';cancel.textContent=labels.cancel||'';main.setAttribute('aria-busy','false')}; window.addEventListener('message',({data})=>{if(!data)return;if(data.method==='ui/notifications/tool-input'){input=data.params&&data.params.arguments||input}if(data.method==='ui/notifications/tool-result'){let payload=data.params&&(data.params.structuredContent||data.params.result||data.params);if(payload&&Array.isArray(payload.content)&&payload.content[0]&&payload.content[0].text){try{payload=JSON.parse(payload.content[0].text)}catch(_){}}show(payload||{})}if(data.id&&data.result&&data.result.hostContext){setTheme(data.result.hostContext);emit('ui/notifications/initialized',{})}});confirm.addEventListener('click',()=>emit('tools/call',{name:toolName,arguments:{...input,confirmed:true}}));cancel.addEventListener('click',()=>{confirm.disabled=true;cancel.disabled=true;main.setAttribute('aria-busy','false')});emit('ui/initialize',{capabilities:{}}); })();
</script></main></body></html>

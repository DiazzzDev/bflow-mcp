<!doctype html>
<html lang="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{color-scheme:light dark;--bg:#fff;--fg:#172033;--card:#f5f7fb;--line:#c8d0dc;--accent:#075fc4;--muted:#526176;--danger:#b42318}
    @media(prefers-color-scheme:dark){:root{--bg:#101722;--fg:#edf2fa;--card:#1c2736;--line:#3a4a5d;--accent:#8dc2ff;--muted:#aab7c8;--danger:#ffb4ab}}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#101722;--fg:#edf2fa;--card:#1c2736;--line:#3a4a5d;--accent:#8dc2ff;--muted:#aab7c8;--danger:#ffb4ab}
    :root[data-theme="light"]{color-scheme:light}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
    main{display:grid;gap:.85rem;padding:1rem}label{display:grid;gap:.35rem}
    input,select,textarea{font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:.35rem;background:var(--bg);color:var(--fg)}
    button{padding:.55rem .75rem;border:1px solid var(--accent);border-radius:.35rem;background:var(--accent);color:Canvas;justify-self:start}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    textarea{resize:none}.error{color:var(--danger)}.optional,.hint{color:var(--muted);font-size:.875rem}
    .type-toggle,.date-presets{display:grid;gap:.5rem}.type-toggle{grid-template-columns:1fr 1fr}
    .type-toggle button{width:100%;background:transparent;color:var(--fg)}
    .type-toggle button[aria-pressed="true"]{background:var(--accent);color:Canvas}
    .date-presets{grid-template-columns:repeat(2,max-content)}
  </style>
</head>
<body>
  <main aria-live="polite" aria-busy="true">
    <h1 id="title"></h1>
    <p id="status"></p>
    <form id="form">
      <div id="type-toggle" class="type-toggle" role="group">
        <button id="income" type="button" aria-pressed="false"></button>
        <button id="expense" type="button" aria-pressed="true"></button>
      </div>
      <label><span id="name-label"></span><input id="name" required maxlength="50"></label>
      <label><span id="amount-label"></span><input id="amount" type="number" min="0.01" step="0.01" required></label>
      <label><span id="date-label"></span><input id="date" type="date" required><span id="date-hint" class="hint"></span>
        <span class="date-presets"><button id="today" type="button"></button><button id="yesterday" type="button"></button></span>
      </label>
      <label><span id="wallet-label"></span><select id="wallet" required></select><span id="wallet-error" class="error" role="status"></span></label>
      <label><span id="category-label"></span><select id="category" required></select><span id="category-error" class="error" role="status"></span></label>
      <label><span><span id="description-label"></span> <span id="description-optional" class="optional"></span></span><textarea id="description" maxlength="100"></textarea></label>
      <button id="submit" type="submit" disabled></button>
    </form>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const main = document.querySelector('main');
      const form = document.querySelector('#form');
      const status = document.querySelector('#status');
      const submit = document.querySelector('#submit');
      let labels = {};
      let locale = 'es';
      let walletsLoaded = false;
      let categoriesLoaded = false;
      let allCategories = [];
      const pendingLookups = new Map();
      let sequence = 0;
      let initializeId = null;
      let initialized = false;
      let type = 'EXPENSE';

      const emit = (method, params) => {
        const request = method === 'ui/initialize' || method === 'tools/call';
        const message = {jsonrpc: '2.0', method, params};
        if (request) message.id = ++sequence;
        parent.postMessage(message, '*');
        return request ? message.id : null;
      };

      const reportSize = () => {
        if (initialized) emit('ui/notifications/size-changed', {
          width: document.documentElement.scrollWidth,
          height: document.documentElement.scrollHeight
        });
      };
      new ResizeObserver(reportSize).observe(document.body);

      const unwrap = (value) => value && typeof value === 'object' && value.data
        ? unwrap(value.data) : value;

      const records = (value) => {
        const data = unwrap(value);
        return Array.isArray(data) ? data
          : data && (data.content || data.items || data.wallets || data.categories) || [];
      };

      const select = (id, items, emptyMessage) => {
        const node = document.querySelector('#' + id);
        node.replaceChildren();
        if (!items.length) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = emptyMessage;
          node.append(option);
          return;
        }
        const ordered = id === 'wallet'
          ? [...items].sort((left, right) => Number(Boolean(right.defaultWallet))
            - Number(Boolean(left.defaultWallet))) : items;
        ordered.forEach((item) => {
          const option = document.createElement('option');
          option.value = item.id || item.walletId || item.categoryId || '';
          option.textContent = item.name || item.title || option.value;
          node.append(option);
        });
      };

      const updateSubmit = () => {
        submit.disabled = !(walletsLoaded && categoriesLoaded
          && document.querySelector('#wallet').value
          && document.querySelector('#category').value);
      };

      const renderCategoriesForType = () => {
        const matching = allCategories.filter((item) => !item.type || item.type === type);
        select('category', matching, labels.categoryEmpty || '');
        updateSubmit();
      };

      const callLookup = (kind) => {
        const requestId = emit('tools/call', {
          name: kind === 'wallets' ? 'listWallets' : 'listCategories',
          arguments: {}
        });
        pendingLookups.set(requestId, kind);
      };

      const renderLookupError = (kind, error) => {
        const field = document.querySelector('#' + (kind === 'wallets'
          ? 'wallet-error' : 'category-error'));
        field.replaceChildren();
        field.textContent = error.message || '';
        if (error.retryable) {
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = labels.retry || '';
          retry.addEventListener('click', () => callLookup(kind));
          field.append(document.createElement('br'), retry);
        }
        if (kind === 'wallets') {
          walletsLoaded = false;
        } else {
          categoriesLoaded = false;
        }
        updateSubmit();
      };

      const renderLookupResult = (kind, payload) => {
        if (payload && payload.code) {
          renderLookupError(kind, payload);
          return;
        }
        const data = records(payload);
        if (kind === 'wallets') {
          select('wallet', data, labels.walletEmpty || '');
          walletsLoaded = true;
        } else {
          allCategories = data;
          categoriesLoaded = true;
          renderCategoriesForType();
        }
        updateSubmit();
      };

      const completeLookup = (kind, payload) => {
        renderLookupResult(kind, payload);
        if (kind === 'wallets') {
          callLookup('categories');
        } else {
          status.textContent = '';
          main.setAttribute('aria-busy', 'false');
        }
      };

      const parseContent = (result) => {
        if (result && Array.isArray(result.content)
            && result.content[0] && result.content[0].text) {
          try {
            return JSON.parse(result.content[0].text);
          } catch (_) {
            return result;
          }
        }
        return result;
      };

      const setType = (value) => {
        type = value;
        document.querySelector('#income').setAttribute('aria-pressed', String(value === 'INCOME'));
        document.querySelector('#expense').setAttribute('aria-pressed', String(value === 'EXPENSE'));
        if (categoriesLoaded) renderCategoriesForType();
      };

      const localDate = (offset) => {
        const value = new Date();
        value.setDate(value.getDate() + offset);
        value.setMinutes(value.getMinutes() - value.getTimezoneOffset());
        return value.toISOString().slice(0, 10);
      };

      const unwrapCallResult = (result) => {
        const payload = parseContent(result);
        if (result && result.isError && !(payload && payload.code)) {
          const message = result.content && result.content[0]
            ? result.content[0].text : labels.optionLoadError;
          return {code: 'TOOL_ERROR', message, retryable: true};
        }
        return payload;
      };

      const render = (payload) => {
        labels = payload.labels || labels;
        locale = payload.locale || locale;
        root.lang = locale;
        document.querySelector('#title').textContent = labels.title || '';
        document.querySelector('#type-toggle').setAttribute('aria-label', labels.typeAccessible || '');
        ['name', 'amount', 'date', 'wallet', 'category', 'description'].forEach((key) => {
          document.querySelector('#' + key + '-label').textContent = labels[key] || '';
        });
        document.querySelector('#description-optional').textContent = labels.optional || '';
        document.querySelector('#name').placeholder = labels.namePlaceholder || '';
        document.querySelector('#amount').placeholder = labels.amountPlaceholder || '';
        document.querySelector('#description').placeholder = labels.descriptionPlaceholder || '';
        document.querySelector('#date-hint').textContent = labels.dateExample || '';
        submit.textContent = labels.submit || '';
        status.textContent = labels.loading || '';
        document.querySelector('#income').textContent = labels.income || '';
        document.querySelector('#expense').textContent = labels.expense || '';
        document.querySelector('#today').textContent = labels.today || '';
        document.querySelector('#yesterday').textContent = labels.yesterday || '';
        document.querySelector('#wallet').setAttribute('aria-label', labels.wallet || '');
        document.querySelector('#category').setAttribute('aria-label', labels.category || '');
        document.querySelector('#date').value = localDate(0);
        setType('EXPENSE');
        main.setAttribute('aria-busy', 'true');
        callLookup('wallets');
      };

      window.addEventListener('message', ({data}) => {
        if (!data) return;
        if (data.id === initializeId && data.result) {
          if (['light', 'dark'].includes(data.result.hostContext?.theme)) {
            root.dataset.theme = data.result.hostContext.theme;
          }
          initialized = true;
          emit('ui/notifications/initialized', {});
          reportSize();
          return;
        }
        if (data.method === 'ui/notifications/host-context-changed'
            && ['light', 'dark'].includes(data.params?.theme)) {
          root.dataset.theme = data.params.theme;
        }
        if (!initialized) return;
        if (pendingLookups.has(data.id)) {
          const kind = pendingLookups.get(data.id);
          pendingLookups.delete(data.id);
          const payload = data.error
            ? {code: 'TOOL_ERROR', message: data.error.message || labels.optionLoadError,
              retryable: true}
            : unwrapCallResult(data.result);
          completeLookup(kind, payload);
          return;
        }
        if (data.method === 'ui/notifications/tool-result') {
          const result = data.params && (data.params.structuredContent || data.params);
          const payload = parseContent(result);
          if (payload && payload.labels) {
            render(payload);
          }
        }
      });

      document.querySelector('#income').addEventListener('click', () => setType('INCOME'));
      document.querySelector('#expense').addEventListener('click', () => setType('EXPENSE'));
      document.querySelector('#today').addEventListener('click', () => {
        document.querySelector('#date').value = localDate(0);
      });
      document.querySelector('#yesterday').addEventListener('click', () => {
        document.querySelector('#date').value = localDate(-1);
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const args = {
          type,
          title: document.querySelector('#name').value,
          amount: Number(document.querySelector('#amount').value),
          date: document.querySelector('#date').value,
          walletId: document.querySelector('#wallet').value,
          categoryId: document.querySelector('#category').value,
          description: document.querySelector('#description').value || null,
          confirmed: false
        };
        emit('tools/call', {name: 'createTransaction', arguments: args});
      });

      initializeId = emit('ui/initialize', {
        appInfo: {name: 'BFlow transaction form', version: '1.0.0'},
        protocolVersion: '2026-01-26',
        appCapabilities: {}
      });
    })();
  </script>
</body>
</html>

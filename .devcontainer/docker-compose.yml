services:
  app:
    container_name: bflow-mcp-dev
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - ../.env

    ports:
      - "127.0.0.1:8081:8081"

    volumes:
      - ../..:/workspaces:cached

    command: sleep infinity

    networks:
      - bflow-mcp-network

networks:
  bflow-mcp-network:
    driver: bridge
name: bflow-mcp Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: bflow-mcp-production
  cancel-in-progress: true

jobs:
  validate-environment:
    name: Validate deployment environment
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate required configuration is present
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
          ECS_MCP_EXECUTION_ROLE_ARN: ${{ vars.ECS_MCP_EXECUTION_ROLE_ARN }}
          ECS_MCP_TASK_ROLE_ARN: ${{ vars.ECS_MCP_TASK_ROLE_ARN }}
          CLOUDWATCH_MCP_LOG_GROUP: ${{ vars.CLOUDWATCH_MCP_LOG_GROUP }}
          ECS_PUBLIC_SUBNET_1: ${{ vars.ECS_PUBLIC_SUBNET_1 }}
          ECS_PUBLIC_SUBNET_2: ${{ vars.ECS_PUBLIC_SUBNET_2 }}
          ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          COGNITO_ISSUER_URI: ${{ vars.COGNITO_ISSUER_URI }}
          COGNITO_HOSTED_UI_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
          BFLOW_API_BASE_URL: ${{ vars.BFLOW_API_BASE_URL }}
          BFLOW_MCP_PUBLIC_BASE_URL: ${{ vars.BFLOW_MCP_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail

          # Checks only that each value is NON-EMPTY. Never echoes the
          # actual value, even for vars (not just secrets) — a missing
          # config error message is the only thing that needs to reach
          # the log here.
          required=(
            AWS_ROLE_ARN
            AWS_REGION
            ECR_REPOSITORY
            ECS_CLUSTER_NAME
            ECS_SERVICE_NAME
            ECS_CONTAINER_NAME
            ECS_TASK_FAMILY
            ECS_MCP_EXECUTION_ROLE_ARN
            ECS_MCP_TASK_ROLE_ARN
            CLOUDWATCH_MCP_LOG_GROUP
            ECS_PUBLIC_SUBNET_1
            ECS_PUBLIC_SUBNET_2
            ECS_SECURITY_GROUP
            COGNITO_ISSUER_URI
            COGNITO_HOSTED_UI_DOMAIN
            BFLOW_API_BASE_URL
            BFLOW_MCP_PUBLIC_BASE_URL
          )

          for var in "${required[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not configured."
              exit 1
            fi
          done

      - name: Validate Cognito issuer URI format
        env:
          COGNITO_ISSUER_URI: ${{ vars.COGNITO_ISSUER_URI }}
        run: |
          set -euo pipefail

          if [[ ! "$COGNITO_ISSUER_URI" =~ ^https://cognito-idp\.[a-z0-9-]+\.amazonaws\.com/[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::COGNITO_ISSUER_URI does not look like a valid Cognito issuer URI."
            exit 1
          fi

      - name: Validate Cognito Hosted UI domain format
        env:
          COGNITO_HOSTED_UI_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
        run: |
          set -euo pipefail

          # Accepts both the default *.auth.<region>.amazoncognito.com
          # domain and a custom domain (e.g. a future auth.bflow-studio.com).
          if [[ ! "$COGNITO_HOSTED_UI_DOMAIN" =~ ^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$ ]]; then
            echo "::error::COGNITO_HOSTED_UI_DOMAIN does not look like a valid domain."
            exit 1
          fi

      - name: Validate ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ vars.ECR_REPOSITORY }}" \
            >/dev/null

      - name: Validate ECS cluster
        run: |
          aws ecs describe-clusters \
            --clusters "${{ vars.ECS_CLUSTER_NAME }}" \
            >/dev/null

      - name: Validate ECS networking
        run: |
          aws ec2 describe-subnets \
            --subnet-ids \
              "${{ vars.ECS_PUBLIC_SUBNET_1 }}" \
              "${{ vars.ECS_PUBLIC_SUBNET_2 }}" \
            >/dev/null

          aws ec2 describe-security-groups \
            --group-ids "${{ vars.ECS_SECURITY_GROUP }}" \
            >/dev/null

      - name: Validate CloudWatch log group
        run: |
          LOG_GROUP_EXISTS=$(aws logs describe-log-groups \
            --log-group-name-prefix "${{ vars.CLOUDWATCH_MCP_LOG_GROUP }}" \
            --query "logGroups[?logGroupName=='${{ vars.CLOUDWATCH_MCP_LOG_GROUP }}'] | length(@)" \
            --output text)

          if [ "$LOG_GROUP_EXISTS" -ne "1" ]; then
            echo "::error::CloudWatch log group does not exist."
            exit 1
          fi

      - name: Validate IAM roles exist
        run: |
          aws iam get-role \
            --role-name "$(basename '${{ vars.ECS_MCP_EXECUTION_ROLE_ARN }}')" \
            >/dev/null

          aws iam get-role \
            --role-name "$(basename '${{ vars.ECS_MCP_TASK_ROLE_ARN }}')" \
            >/dev/null

      - name: Verify this role can actually perform the deploy actions
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_MCP_EXECUTION_ROLE_ARN: ${{ vars.ECS_MCP_EXECUTION_ROLE_ARN }}
          ECS_MCP_TASK_ROLE_ARN: ${{ vars.ECS_MCP_TASK_ROLE_ARN }}
        run: |
          set -euo pipefail

          # Same actions as infra/19-github-oidc.sh's verify_permissions,
          # simulated the same way: actions scoped to a specific ARN in
          # the policy must be tested against that same ARN, not "*" —
          # otherwise the simulation always reports implicitDeny even
          # when the policy is correct.
          ECR_REPOSITORY_ARN=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query "repositories[0].repositoryArn" \
            --output text)

          checks=(
            "ecr:GetAuthorizationToken|*"
            "ecr:PutImage|${ECR_REPOSITORY_ARN}"
            "ecs:RegisterTaskDefinition|*"
            "ecs:UpdateService|*"
            "ecs:CreateService|*"
            "ec2:DescribeSubnets|*"
            "logs:DescribeLogGroups|*"
            "iam:PassRole|${ECS_MCP_EXECUTION_ROLE_ARN}"
            "iam:PassRole|${ECS_MCP_TASK_ROLE_ARN}"
          )

          all_ok=true
          for entry in "${checks[@]}"; do
            IFS='|' read -r action resource <<< "$entry"

            decision=$(aws iam simulate-principal-policy \
              --policy-source-arn "$AWS_ROLE_ARN" \
              --action-names "$action" \
              --resource-arns "$resource" \
              --query "EvaluationResults[0].EvalDecision" \
              --output text)

            if [ "$decision" != "allowed" ]; then
              echo "::error::Missing permission: $action on $resource ($decision)"
              all_ok=false
            fi
          done

          if [ "$all_ok" != "true" ]; then
            exit 1
          fi

      - name: Environment validation summary
        run: |
          echo "Environment validation completed successfully."

  deploy:
    name: Deploy to ECS
    needs: validate-environment
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate task definition
        env:
          ECS_MCP_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
          ECS_MCP_EXECUTION_ROLE_ARN: ${{ vars.ECS_MCP_EXECUTION_ROLE_ARN }}
          ECS_MCP_TASK_ROLE_ARN: ${{ vars.ECS_MCP_TASK_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLOUDWATCH_MCP_LOG_GROUP: ${{ vars.CLOUDWATCH_MCP_LOG_GROUP }}
          COGNITO_ISSUER_URI: ${{ vars.COGNITO_ISSUER_URI }}
          COGNITO_HOSTED_UI_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
          BFLOW_API_BASE_URL: ${{ vars.BFLOW_API_BASE_URL }}
          BFLOW_MCP_PUBLIC_BASE_URL: ${{ vars.BFLOW_MCP_PUBLIC_BASE_URL }}
        run: |
          envsubst < ecs/task-definition.template.json > ecs/task-definition.json

      - name: Validate generated task definition
        run: |
          if grep -q '\${' ecs/task-definition.json; then
            echo "::error::Task definition contains unresolved template variables."
            exit 1
          fi
          jq empty ecs/task-definition.json

      - name: Generate ECS network configuration
        env:
          ECS_PUBLIC_SUBNET_1: ${{ vars.ECS_PUBLIC_SUBNET_1 }}
          ECS_PUBLIC_SUBNET_2: ${{ vars.ECS_PUBLIC_SUBNET_2 }}
          ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
        run: |
          envsubst < ecs/network-config.template.json > ecs/network-config.json

      - name: Validate generated network configuration
        run: |
          if grep -q '\${' ecs/network-config.json; then
            echo "::error::Network configuration contains unresolved variables."
            exit 1
          fi
          jq empty ecs/network-config.json

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register new task definition
        id: register-task
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-task-definition.outputs.task-definition }} \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task_definition=$TASK_DEFINITION_ARN" >> $GITHUB_OUTPUT

      - name: Check ECS service status
        id: ecs-service-check
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_NAME }}" \
            --query "services[0].status" \
            --output text 2>/dev/null)
          SERVICE_STATUS="${SERVICE_STATUS:-MISSING}"
          [ "$SERVICE_STATUS" = "None" ] && SERVICE_STATUS="MISSING"

          echo "status=$SERVICE_STATUS" >> $GITHUB_OUTPUT
          echo "Service status: $SERVICE_STATUS"

      - name: Deploy ECS service
        run: |
          STATUS="${{ steps.ecs-service-check.outputs.status }}"

          if [ "$STATUS" = "ACTIVE" ]; then
              echo "Updating existing ECS service..."
              aws ecs update-service \
                --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
                --service "${{ vars.ECS_SERVICE_NAME }}" \
                --task-definition "${{ steps.register-task.outputs.task_definition }}" \
                --force-new-deployment
          else
              echo "Creating ECS service (status was: $STATUS)..."
              if ! aws ecs create-service \
                    --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
                    --service-name "${{ vars.ECS_SERVICE_NAME }}" \
                    --task-definition "${{ steps.register-task.outputs.task_definition }}" \
                    --desired-count 1 \
                    --launch-type FARGATE \
                    --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100" \
                    --network-configuration file://ecs/network-config.json \
                    --tags \
                      key=Project,value=bflow-mcp \
                      key=Environment,value=production \
                      key=ManagedBy,value=github-actions \
                    2> create_error.log; then
                  if grep -q "ServiceAlreadyExistsException\|already exists" create_error.log; then
                      echo "Service was created concurrently or status check was stale — falling back to update."
                      aws ecs update-service \
                        --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
                        --service "${{ vars.ECS_SERVICE_NAME }}" \
                        --task-definition "${{ steps.register-task.outputs.task_definition }}" \
                        --force-new-deployment
                  else
                      cat create_error.log
                      exit 1
                  fi
              fi
          fi

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_NAME }}" \
          || {
              echo "========== SERVICE =========="
              aws ecs describe-services \
                --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
                --services "${{ vars.ECS_SERVICE_NAME }}"

              echo "========== STOPPED TASKS =========="
              STOPPED_ARNS=$(aws ecs list-tasks \
                --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
                --service-name "${{ vars.ECS_SERVICE_NAME }}" \
                --desired-status STOPPED \
                --query "taskArns[]" \
                --output text)
              [ -n "$STOPPED_ARNS" ] && aws ecs describe-tasks \
                --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
                --tasks $STOPPED_ARNS

              exit 1
          }

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully."
          echo "Task definition family: ${{ vars.ECS_TASK_FAMILY }}"
          echo "DNS sync (infra/16-mcp-dns-sync.sh) is not wired up yet — see that script's known gap before relying on the mcp.bflow-studio.com record."
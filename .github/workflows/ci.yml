name: bflow-mcp Application CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Unit, integration, style and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify tests and coverage baseline
        run: ./mvnw -B verify
      - name: Check style
        run: ./mvnw -B checkstyle:check
      - name: Publish coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

  mcp-apps-qa:
    name: MCP Apps browser harness
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/java:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Run isolated Playwright QA profile
        run: mvn -B -P mcp-apps-qa test

  security:
    name: Secret and container scanning
    uses: ./.github/workflows/security.yml
